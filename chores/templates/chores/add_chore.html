{% extends "chores/base.html" %}

{% block title %}Add a chore — Household Chores{% endblock %}

{% block content %}
  <h1>Add a one-off chore</h1>
  <p>Household: {{ household.name }}</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Add chore</button>
  </form>
  <p><a href="{% url 'home' %}">Back home</a></p>
{% endblock %}
